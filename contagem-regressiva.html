<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faltam quantos dias?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cork: #B98A56;
    --cork-dark: #9C7141;
    --paper: #FBF4E4;
    --tape-pink: #E9A6C4;
    --tape-blue: #9ED4E0;
    --tape-yellow: #EFC24E;
    --ink: #2B2118;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height: 100vh;
    font-family: "Nunito", sans-serif;
    color: var(--ink);
    background-color: var(--cork);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(0,0,0,0.10) 0, transparent 3%),
      radial-gradient(circle at 65% 8%, rgba(0,0,0,0.08) 0, transparent 2.5%),
      radial-gradient(circle at 40% 40%, rgba(0,0,0,0.09) 0, transparent 3%),
      radial-gradient(circle at 85% 60%, rgba(0,0,0,0.08) 0, transparent 2.5%),
      radial-gradient(circle at 10% 70%, rgba(0,0,0,0.09) 0, transparent 3%),
      radial-gradient(circle at 55% 85%, rgba(0,0,0,0.08) 0, transparent 2.5%),
      radial-gradient(circle at 92% 92%, rgba(0,0,0,0.09) 0, transparent 3%),
      linear-gradient(var(--cork), var(--cork-dark));
    background-size: 40px 40px, 60px 60px, 50px 50px, 45px 45px, 55px 55px, 48px 48px, 42px 42px, cover;
    overflow-x: hidden;
  }

  .board{
    max-width: 860px;
    margin: 0 auto;
    padding: 50px 20px 70px;
    position: relative;
  }

  .title-strip{
    text-align: center;
    margin-bottom: 10px;
  }

  h1{
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: clamp(38px, 8vw, 64px);
    color: var(--paper);
    margin: 0;
    line-height: 1.05;
    transform: rotate(-2deg);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
  }

  h1 .highlight{
    color: var(--tape-yellow);
  }

  .sub{
    text-align: center;
    font-family: "Kalam", cursive;
    font-size: 17px;
    color: var(--paper);
    opacity: 0.85;
    margin: 6px 0 40px;
    transform: rotate(1deg);
  }

  /* countdown note */
  .note{
    background: var(--paper);
    max-width: 420px;
    margin: 0 auto 46px;
    padding: 26px 20px 22px;
    text-align: center;
    box-shadow: 0 12px 22px rgba(0,0,0,0.30);
    transform: rotate(-1.2deg);
    position: relative;
  }

  .pin{
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8a8a, #c22b2b 70%);
    position: absolute;
    top: -10px;
    left: 50%;
    margin-left: -9px;
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }

  .countdown{
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .unit{
    min-width: 64px;
  }

  .unit .num{
    font-family: "Kalam", cursive;
    font-weight: 700;
    font-size: 38px;
    color: var(--cork-dark);
    display: block;
    line-height: 1;
  }

  .unit .label{
    font-family: "Nunito", sans-serif;
    font-size: 11px;
    color: #6b5c46;
    text-transform: lowercase;
  }

  .note .to{
    font-family: "Kalam", cursive;
    font-size: 15px;
    color: #6b5c46;
    margin-top: 14px;
  }

  .note .to b{ color: var(--ink); }

  /* gallery scattered polaroids */
  .gallery{
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 26px 18px;
    padding: 10px 0 20px;
  }

  .polaroid{
    background: var(--paper);
    padding: 10px 10px 34px;
    width: 170px;
    box-shadow: 0 10px 18px rgba(0,0,0,0.32);
    position: relative;
  }

  .polaroid img{
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
    filter: saturate(0.96) contrast(1.02);
  }

  .polaroid figcaption{
    font-family: "Caveat", cursive;
    font-size: 19px;
    text-align: center;
    margin-top: 8px;
    color: var(--ink);
  }

  .tape{
    position: absolute;
    width: 60px;
    height: 22px;
    opacity: 0.85;
    top: -12px;
    left: 50%;
    margin-left: -30px;
  }

  .p1{ transform: rotate(-6deg); }
  .p2{ transform: rotate(4deg); margin-top: 18px; }
  .p3{ transform: rotate(-3deg); }
  .p4{ transform: rotate(5deg); margin-top: 10px; }
  .p5{ transform: rotate(-4deg); margin-top: 24px; }

  .p1 .tape{ background: var(--tape-blue); }
  .p2 .tape{ background: var(--tape-yellow); }
  .p3 .tape{ background: var(--tape-pink); }
  .p4 .tape{ background: var(--tape-blue); }
  .p5 .tape{ background: var(--tape-yellow); }

  .scribble{
    position: absolute;
    opacity: 0.5;
  }

  footer{
    text-align: center;
    font-family: "Kalam", cursive;
    color: var(--paper);
    opacity: 0.65;
    font-size: 13px;
    margin-top: 10px;
  }

  @media (max-width: 480px){
    .polaroid{ width: 130px; }
    .polaroid img{ height: 130px; }
  }
</style>
</head>

<script>
  // troque pela data real da viagem
  const eventDate = new Date();
  eventDate.setDate(eventDate.getDate() + 25);
  eventDate.setHours(8, 0, 0, 0);

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    const now = new Date();
    let diff = eventDate - now;

    if (diff <= 0){
      document.getElementById('days').textContent = '00';
      document.getElementById('hours').textContent = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      document.getElementById('daysHeadline').textContent = '0';
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent = pad(d);
    document.getElementById('hours').textContent = pad(h);
    document.getElementById('minutes').textContent = pad(m);
    document.getElementById('seconds').textContent = pad(s);
    document.getElementById('daysHeadline').textContent = d;
  }

  tick();
  setInterval(tick, 1000);
</script>

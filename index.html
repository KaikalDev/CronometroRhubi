<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faltam quantos dias?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="board">
    <svg class="scribble" style="top:10px; left:4%; width:44px;" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z" fill="#EFC24E"/></svg>
    <svg class="scribble" style="top:30px; right:5%; width:34px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#9ED4E0"/></svg>

    <div class="title-strip">
      <h1>Faltam <span class="highlight" id="daysHeadline">--</span> dias pra<br>Rhubi ir pra <span id="destinoNota">--</span></h1>
    </div>

    <div class="note">
      <div class="pin"></div>
        <div class="countdown">
          <!-- <div class="unit"><span class="num" id="days">00</span><span class="label">dias</span></div>
          <div class="unit"><span class="num" id="hours">00</span><span class="label">horas</span></div>
          <div class="unit"><span class="num" id="minutes">00</span><span class="label">min</span></div>
          <div class="unit"><span class="num" id="seconds">00</span><span class="label">seg</span></div> -->
          <div class="unit"><span class="num" id="seconds">Ela ainda não mandou a documentação</span></div> 
        </div>
        <p class="to">até <b>Rhubi</b> ir para sua missão em <b id="destinoHeadline">--</b></p>
    </div>

    <div class="gallery">
      <figure class="polaroid p1">
        <div class="tape"></div>
        <img src="Fotos/Foto_1.png">
      </figure>
      <figure class="polaroid p2">
        <div class="tape"></div>
        <img src="Fotos/Foto_2.jpeg">
      </figure>
      <figure class="polaroid p3">
        <div class="tape"></div>
        <img src="Fotos/Foto_3.jpeg">
      </figure>
      <figure class="polaroid p4">
        <div class="tape"></div>
        <img src="Fotos/Foto_4.jpeg">
      </figure>
      <figure class="polaroid p5">
        <div class="tape"></div>
        <img src="Fotos/Foto_5.png">
      </figure>
    </div>

    <footer>Desenvolvido por <a href="https://github.com/KaikalDev">&copy;KaikalDev</a></footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
